<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <header class="bg-black fg-white py-12">
      <div class="container">
        <span class="badge theme-warning fs-md rounded-4">Free workshop</span>
        <h1 class="fs-4xl fw-bold mt-2">Web Design Workshop</h1>
        <p class="fs-lg mb-0">
          Build your first responsive webpage with HTML and Bootstrap.
        </p>
      </div>
    </header>
    <main class="bg-1 py-12">
      <div class="container">
        <div class="row g-6">
          <div class="md:col-5">
            <div class="border border-1">
              <div class="card">
                <div class="card-body">
                  <h2 class="fs-x1">Workshop details</h2>
                  <dl class="mb-0">
                    <dt>Day</dt>
                    <dd>Saturday</dd>
                    <dt>Location</dt>
                    <dd>School computer lab</dd>
                    <dt>What to bring</dt>
                    <dd class="mb-0">A laptop and charger</dd>
                  </dl>
                </div>
              </div>
            </div>
          </div>
          <div class="md:col-7">
            <div class="border border-1">
              <div class="card">
                <div class="card-body">
                  <h2 class="fs-xl">Register for a session</h2>
                  <form>
                    <div class="mb-5">
                      <label for="name" class="form-label">Full name</label>
                      <input type="text" id="name" class="form-control" />
                    </div>
                    <div class="mb-5">
                      <label for="email" class="form-label"
                        >Email address</label
                      >
                      <input type="email" id="email" class="form-control" />
                    </div>
                    <fieldset class="mb-5">
                      <legend class="fs-md fw-bold">Choose a session</legend>
                      <div class="form-field">
                        <input
                          type="radio"
                          id="morning"
                          name="session"
                          class="radio"
                        />
                        <label for="morning">Morning · 9:00–11:00 AM</label>
                      </div>
                      <div class="form-field">
                        <input
                          type="radio"
                          id="afternoon"
                          name="session"
                          class="radio"
                        />
                        <label for="afternoon">Afternoon · 2:00–4:00 PM</label>
                      </div>
                    </fieldset>
                    <button type="submit" class="btn-solid theme-primary">
                      Register
                    </button>
                  </form>
                  <p class="fs-sm fg-secondary mb-0">
                    Practice form. Entries are discarded.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
